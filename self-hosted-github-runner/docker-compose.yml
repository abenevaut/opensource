services:
  gh-runner:
    image: ghcr.io/abenevaut/self-hosted-github-runner:latest
    container_name: gh-runner
    restart: always
    # Set PLATFORM in .env to match your host: linux/amd64 or linux/arm64
    platform: ${PLATFORM:-linux/amd64}
    environment:
      - ORGANIZATION=${ORGANIZATION:-<YOUR-GITHUB-ORGANIZATION>}
      - ACCESS_TOKEN=${ACCESS_TOKEN:-<YOUR-GITHUB-ACCESS-TOKEN>}
      # --- options (uncomment to override) ---
      # - REPOSITORY=mon-repo          # repo-level instead of org-level
      # - RUNNER_NAME=runner-01        # default: container hostname
      # - RUNNER_LABELS=self-hosted,linux,x64,docker
      # - RUNNER_WORKDIR=_work
      # - EPHEMERAL=true               # one job per container (recommended)
      # Container hooks network: réseau Docker utilisé par les containers de job (container:/services:)
      # "host" = partage le réseau du runner ; ou spécifie un réseau Docker existant.
      # - ACTIONS_RUNNER_CONTAINER_NETWORK=host
    volumes:
      # Docker socket passthrough (DooD): gives the runner access to the host Docker daemon.
      # Required for workflows that use `docker` commands, docker/build-push-action,
      # or `container:`/`services:` in job definitions.
      - /var/run/docker.sock:/var/run/docker.sock

      # ⚠️  CRITICAL for DooD container jobs (container:/services:):
      # The runner directory MUST be mounted from the host at the EXACT SAME absolute path.
      # When container hooks call `docker run -v /home/docker/actions-runner/externals:...`,
      # the host Docker daemon resolves that path on the HOST filesystem — not inside
      # the runner container. Both paths must match for bind mounts to succeed.
      #
      # On first startup, entrypoint.sh copies the runner installation from the image
      # (/opt/runner-dist) into this host directory automatically.
      #
      # Create the directory on your host before starting:
      #   sudo mkdir -p /home/docker/actions-runner
      - /home/docker/actions-runner:/home/docker/actions-runner
