name: self-hosted-github-runner-test

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'self-hosted-github-runner/**'

defaults:
  run:
    working-directory: ./self-hosted-github-runner

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    concurrency:
      group: self-hosted-github-runner-test-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:

    - name: Checkout project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/cache@v5
      with:
        path: self-hosted-github-runner/vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.7

    - run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3

    - run: |
        bundle exec rubocop
        bundle exec rspec
      env:
        COMPOSE_DOCKER_CLI_BUILD: 1
        DOCKER_BUILDKIT: 1
